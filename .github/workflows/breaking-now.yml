name: Burlington breaking now

on:
  schedule:
    # Check official police/newsroom feeds every 15 minutes, offset from GO / 511 jobs.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_breaking_now.py'
      - 'scripts/publish_breaking_briefs.py'
      - 'scripts/sources/**'
      - 'data/story-overrides.json'
      - '.github/workflows/breaking-now.yml'

permissions:
  contents: write

# All bots that write generated data to main use the same queue. This prevents
# a breaking-news commit from rebasing against a simultaneous GO/traffic update.
concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build breaking now from official feeds and cached surfaces
        run: python scripts/build_breaking_now.py --live
      - name: Publish durable breaking briefs
        run: python scripts/publish_breaking_briefs.py
      - name: Commit breaking surface and articles
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-breaking"
          --message "Update Burlington breaking now"
          data/breaking-now.json data/breaking-archive.json data/discovery-queue.json stories
