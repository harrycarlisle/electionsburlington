name: Burlington breaking now

on:
  schedule:
    # Breaking monitoring stays frequent, but code/content pushes no longer create extra runs.
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Breaking and Local Update rail from live sources
        run: python scripts/refresh_breaking_now.py
      - name: Add regional news when Local Update is utility-only
        run: python scripts/enrich_regional_local_update.py
      - name: Normalize live-rail destinations and eligibility
        run: python scripts/postprocess_breaking_now.py
      - name: Publish durable breaking briefs
        run: python scripts/publish_breaking_briefs.py
      - name: Render stable homepage first paint
        run: python scripts/render_live_homepage.py
      - name: Normalize search metadata and sitemaps
        run: python scripts/search_indexing_hygiene.py
      - name: Remove duplicate legacy redirect tags
        run: python scripts/dedupe_legacy_redirects.py
      - name: Commit breaking surface, homepage and articles
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-breaking"
          --message "Update Burlington breaking now"
          data/breaking-now.json data/breaking-archive.json data/discovery-queue.json index.html stories articles
          sitemap.xml news-sitemap.xml
