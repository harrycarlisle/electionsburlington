name: Community conversation signal

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  rank-public-discussion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rank eligible public posts
        run: python scripts/update_community_pulse.py
      - name: Publish only a material change
        run: |
          if git diff --quiet -- data/community-pulse.json; then
            echo "The leading signal has not changed."
            exit 0
          fi
          python scripts/safe_bot_commit.py \
            --name "burlington-news-bot" \
            --message "Update Burlington community signal" \
            data/community-pulse.json
