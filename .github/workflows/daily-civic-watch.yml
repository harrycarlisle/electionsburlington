name: Daily Burlington civic watch

on:
  schedule:
    - cron: '15 12,17,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/councillor-profiles.json'
      - 'data/community-discussion.json'
      - 'scripts/update_candidate_assets.py'
      - 'scripts/update_civic_watch.py'
      - 'scripts/update_civic_watch_local.py'
      - '.github/workflows/daily-civic-watch.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Burlington civic sources
        run: python scripts/update_civic_watch_local.py
      - name: Verify candidate photos
        run: python scripts/update_candidate_assets.py
      - name: Commit verified updates
        run: |
          git config user.name "burlington-civic-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-monitor.json data/archive data/daily-brief.json data/image-history.json data/ballot.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Burlington civic watch"
          git push
