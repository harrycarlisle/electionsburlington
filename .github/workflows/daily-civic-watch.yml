name: Daily Burlington news watch

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/councillor-profiles.json'
      - 'data/community-discussion.json'
      - 'data/story-catalog.json'
      - 'data/story-overrides.json'
      - 'data/manual-stories.json'
      - 'data/editorial-policy.json'
      - 'scripts/update_candidate_assets.py'
      - 'scripts/update_civic_watch.py'
      - 'scripts/update_civic_watch_local.py'
      - 'scripts/build_editorial_queue.py'
      - 'scripts/auto_publish_briefs.py'
      - 'scripts/merge_manual_stories.py'
      - 'scripts/rank_stories.py'
      - 'scripts/render_homepage.py'
      - 'scripts/apply_story_presentation.py'
      - 'scripts/sync_public_urls.py'
      - 'scripts/search_indexing_hygiene.py'
      - 'scripts/dedupe_legacy_redirects.py'
      - 'scripts/safe_bot_commit.py'
      - '.github/workflows/daily-civic-watch.yml'

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Burlington news sources
        run: python scripts/update_civic_watch_local.py
      - name: Verify candidate photos
        run: python scripts/update_candidate_assets.py
      - name: Build original-story candidates
        run: python scripts/build_original_candidates.py
      - name: Build editorial queue
        run: python scripts/build_editorial_queue.py
      - name: Publish verified low-risk stories
        run: python scripts/auto_publish_briefs.py
      - name: Merge manually published stories
        run: python scripts/merge_manual_stories.py
      - name: Rotate homepage stories
        run: python scripts/rank_stories.py
      - name: Render stable homepage first paint
        run: python scripts/render_homepage.py
      - name: Publish clean public URLs
        run: python scripts/sync_public_urls.py
      - name: Apply editorial presentation overrides
        run: python scripts/apply_story_presentation.py
      - name: Normalize search metadata and sitemaps
        run: python scripts/search_indexing_hygiene.py
      - name: Remove duplicate legacy redirect tags
        run: python scripts/dedupe_legacy_redirects.py
      - name: Commit verified updates and stories
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-watch"
          --message "Update Burlington news watch"
          data/source-monitor.json data/archive data/daily-brief.json
          data/image-history.json data/ballot.json data/editorial-queue.json
          data/home-surface.json data/auto-published.json data/original-candidates.json
          data/lead-history.json data/story-catalog.json data/radar-seen.json
          index.html articles news explore elections traffic sports games stories
          sitemap.xml news-sitemap.xml 404.html
