name: Daily Burlington civic watch

on:
  schedule:
    - cron: '15 12,17,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Burlington civic sources
        run: python scripts/update_civic_watch.py
      - name: Commit source watch changes
        run: |
          git config user.name "burlington-civic-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/source-monitor.json data/archive data/daily-brief.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Burlington civic watch"
          git push
