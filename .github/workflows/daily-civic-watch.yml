name: Burlington news watch

on:
  schedule:
    # General local-news monitoring remains hourly. Pushes no longer create duplicate runs.
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Burlington news sources
        run: python scripts/update_civic_watch_local.py
      - name: Verify published-story memory
        run: python scripts/test_civic_watch_memory.py
      - name: Build original-story candidates
        run: python scripts/build_original_candidates.py
      - name: Build editorial queue
        run: python scripts/build_editorial_queue.py
      - name: Upload leads for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: burlington-news-leads-${{ github.run_id }}
          path: |
            data/source-monitor.json
            data/daily-brief.json
            data/editorial-queue.json
            data/original-candidates.json
            data/lead-history.json
          retention-days: 14
