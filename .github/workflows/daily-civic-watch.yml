name: Burlington news watch

on:
  schedule:
    # Scan general civic/local sources twice an hour. Breaking sources run separately every 15 minutes.
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Burlington news sources
        run: python scripts/update_civic_watch_local.py
      - name: Verify published-story memory
        run: python scripts/test_civic_watch_memory.py
      - name: Build original-story candidates
        run: python scripts/build_original_candidates.py
      - name: Build editorial queue
        run: python scripts/build_editorial_queue.py
      - name: Verify automatic-publishing gates
        run: python scripts/test_auto_publish_policy.py
      - name: Publish confirmed low-risk stories and follow-ups
        run: python scripts/auto_publish_briefs.py
      - name: Commit confirmed updates and stories
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-watch"
          --message "Update Burlington news watch"
          data/source-monitor.json data/archive data/daily-brief.json
          data/image-history.json data/editorial-queue.json data/auto-published.json
          data/original-candidates.json data/lead-history.json articles/auto
      - name: Upload leads for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burlington-news-leads-${{ github.run_id }}
          path: |
            data/source-monitor.json
            data/daily-brief.json
            data/editorial-queue.json
            data/original-candidates.json
            data/lead-history.json
          retention-days: 14
