name: Burlington election-night results

on:
  schedule:
    - cron: '*/5 0-5 27 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update official Burlington results
        run: |
          python - <<'PY'
          import datetime as dt, subprocess, sys
          now = dt.datetime.now(dt.timezone.utc)
          # Election Day is Oct. 26, 2026. Polls close at 8 p.m. ET = midnight UTC Oct. 27.
          if now.year != 2026 or now.month != 10 or now.day != 27 or not (0 <= now.hour <= 5):
              print('Outside the 2026 Burlington election-night window.')
              sys.exit(0)
          subprocess.check_call([sys.executable, 'scripts/update_election_results.py'])
          PY
      - name: Commit changed results
        run: |
          git config user.name "burlington-results-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/election-results.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Burlington election-night results"
          git push
