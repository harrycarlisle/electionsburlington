name: Election Watch

on:
  schedule:
    - cron: '20 12 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/election-watch.yml'
      - 'tools/polish_site.py'
      - 'scripts/election_watch.py'
      - 'scripts/safe_bot_commit.py'
      - 'site-extra.css'
      - 'site-extra.js'
      - 'privacy.html'
      - 'terms.html'
      - 'help.html'

permissions:
  contents: write
  issues: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Polish static site
        run: python tools/polish_site.py

      - name: Create weekly review and archive
        run: python scripts/election_watch.py

      - name: Commit monitoring state and site polish
        run: >-
          python scripts/safe_bot_commit.py
          --name "election-watch-bot"
          --message "Weekly election source check"
          election-guide.html head-to-head.html monitoring/source-state.json
          monitoring/latest.md monitoring/archive monitoring/history.jsonl
