name: Burlington election watch

on:
  schedule:
    # Weekly until September 14, then daily through Election Day.
    - cron: '20 12 31 8 *'
    - cron: '20 12 7 9 *'
    - cron: '20 12 14-30 9 *'
    - cron: '20 12 1-26 10 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check monitoring window
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y)" = "2026" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify candidate photos
        if: steps.window.outputs.run == 'true'
        run: python scripts/update_candidate_assets.py

      - name: Create election source review and archive
        if: steps.window.outputs.run == 'true'
        run: python scripts/election_watch.py

      - name: Commit election monitoring state
        if: steps.window.outputs.run == 'true'
        run: >-
          python scripts/safe_bot_commit.py
          --name "election-watch-bot"
          --message "Update election source check"
          data/ballot.json monitoring/source-state.json
          monitoring/latest.md monitoring/archive monitoring/history.jsonl
