name: Election Watch

on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Polish static site
        run: python tools/polish_site.py

      - name: Create daily review note
        run: |
          mkdir -p monitoring
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import urllib.request, hashlib, json

          sources = {
              'Meed Ward campaign': 'https://votemarianne.ca/',
              'Lisa Kearns campaign': 'https://lisakearns.ca/',
              'Rory Nisan campaign': 'https://rorynisan.ca/',
              'Official candidate list': 'https://myvote.burlington.ca/for-voters/list-of-candidates/',
              '3110 South Service Road': 'https://www.burlington.ca/en/news/current-development-projects/3110_South_Service_Rd.aspx',
              'Burlington subreddit': 'https://www.reddit.com/r/BurlingtonON/new.json?limit=100',
          }
          ua = {'User-Agent': 'ElectionsBurlington/1.0 (+https://electionsburlington.ca)'}
          state_path = Path('monitoring/source-state.json')
          old = json.loads(state_path.read_text()) if state_path.exists() else {}
          new = {}
          rows = []
          for name, url in sources.items():
              try:
                  req = urllib.request.Request(url, headers=ua)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read()
                  digest = hashlib.sha256(body).hexdigest()
                  changed = old.get(name, {}).get('sha256') not in (None, digest)
                  new[name] = {'url': url, 'sha256': digest}
                  rows.append((name, url, changed, len(body)))
              except Exception as e:
                  rows.append((name, url, None, str(e)))
          state_path.write_text(json.dumps(new, indent=2))
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
          report = [f'# Election Watch — {today}', '',
                    'This automated pass only detects source-page changes. It does **not** publish political claims or sentiment to the live site automatically.', '',
                    '## Source changes']
          for name, url, changed, info in rows:
              status = 'CHANGED — review' if changed else ('No detected change' if changed is False else 'Fetch failed — review manually')
              report += [f'- **{name}:** {status} — {url}']
          report += ['', '## Human review checklist',
                     '- Check newly published candidate quotes and platform pages against the current site wording.',
                     '- Search BurlingtonToday and official Burlington records for candidate or policy updates.',
                     '- Review new r/BurlingtonON discussion for recurring supportive and critical themes.',
                     '- Treat Reddit as anecdotal discussion, never polling.',
                     '- Do not infer Facebook sentiment unless posts are publicly accessible and can be cited.',
                     '- For every candidate, apply the same evidence threshold and comparable time window.',
                     '- If Keith Demoe publishes a platform, interview, or verified portrait, add it to the manual review queue.',
                     '- Never auto-change candidate positions, quotes, factual claims, or sentiment labels without human review.', '']
          Path('monitoring/latest.md').write_text('\n'.join(report))
          PY

      - name: Commit monitoring state and visual polish
        run: |
          git config user.name 'election-watch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html head-to-head.html monitoring/source-state.json monitoring/latest.md
          if git diff --cached --quiet; then
            echo 'No repository changes.'
          else
            git commit -m 'Daily election source check'
            git push
          fi
