name: Explore Burlington event watch

on:
  schedule:
    - cron: '45 11,20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/explore-sources.json'
      - 'scripts/update_explore_watch.py'
      - 'scripts/safe_bot_commit.py'
      - '.github/workflows/explore-watch.yml'

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official event sources
        run: python scripts/update_explore_watch.py
      - name: Commit review candidates
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-explore-watch"
          --message "Update Explore event watch"
          data/explore-watch.json
