name: Explore Burlington event watch

on:
  schedule:
    - cron: '45 11,20 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/explore-sources.json'
      - 'scripts/update_explore_watch.py'
      - '.github/workflows/explore-watch.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official event sources
        run: python scripts/update_explore_watch.py
      - name: Commit review candidates
        run: |
          git config user.name "burlington-explore-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/explore-watch.json
          git diff --cached --quiet && exit 0
          git commit -m "Update Explore event watch"
          git push
