name: GO status

on:
  workflow_dispatch:
  schedule:
    # Roughly 5 a.m.-midnight Toronto during daylight time; enough for early and late trains.
    - cron: '*/30 9-23 * * *'
    - cron: '*/30 0-4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Burlington GO status
        env:
          GO_API_KEY: ${{ secrets.GO_API_KEY }}
        run: python scripts/update_go_status.py
      - name: Commit changed status
        run: |
          if git diff --quiet -- data/go-status.json; then exit 0; fi
          git config user.name "burlington-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/go-status.json
          git commit -m "Update Burlington GO status"
          git push
