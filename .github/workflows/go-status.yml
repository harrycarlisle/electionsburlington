name: GO status

on:
  workflow_dispatch:
  schedule:
    # Roughly 5 a.m.-midnight Toronto during daylight time; enough for early and late trains.
    - cron: '*/30 9-23 * * *'
    - cron: '*/30 0-4 * * *'

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Burlington GO status
        env:
          GO_API_KEY: ${{ secrets.GO_API_KEY }}
        run: python scripts/update_go_status.py
      - name: Commit changed status
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-bot"
          --message "Update Burlington GO status"
          data/go-status.json
