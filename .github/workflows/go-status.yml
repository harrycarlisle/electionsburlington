name: GO status

on:
  # Scheduled automation paused while the site is under construction.
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_go_status.py'
      - 'lib/go-times.js'

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh Burlington GO status
        env:
          GO_API_KEY: ${{ secrets.GO_API_KEY }}
        run: python scripts/update_go_status.py
      - name: Commit changed status
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-bot"
          --message "Update Burlington GO status"
          data/go-status.json
