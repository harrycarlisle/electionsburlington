name: Local intelligence

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/apply_traffic_policy.py'
      - 'scripts/build_traffic_surface.py'
      - '.github/workflows/local-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GTFS realtime parser
        run: python -m pip install --disable-pip-version-check gtfs-realtime-bindings==1.0.0
      - name: Refresh official local feeds
        run: python scripts/update_local_intelligence.py
      - name: Refresh traffic cameras and route surface
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRAFFIC_VISION_KEY: ${{ secrets.TRAFFIC_VISION_KEY }}
        run: |
          python scripts/build_traffic_cameras.py
          python scripts/analyze_traffic_cameras.py
          python scripts/build_traffic_surface.py
          python scripts/apply_traffic_policy.py
      - name: Commit changed data
        run: |
          python scripts/safe_bot_commit.py \
            --name "Burlington News Bot" \
            --message "Update local intelligence" \
            data/local-intelligence.json data/local-intelligence-previous.json data/local-leads.json \
            data/traffic-cameras.json data/traffic-surface.json data/traffic-routes.json data/traffic-estimates.json
