name: Local intelligence

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GTFS realtime parser
        run: python -m pip install --disable-pip-version-check gtfs-realtime-bindings==1.0.0
      - name: Refresh official local feeds
        run: python scripts/update_local_intelligence.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- data/local-intelligence.json data/local-intelligence-previous.json data/local-leads.json; then
            echo "No local intelligence changes"
            exit 0
          fi
          git config user.name "Burlington News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/local-intelligence.json data/local-intelligence-previous.json data/local-leads.json
          git commit -m "Update local intelligence"
          git push
