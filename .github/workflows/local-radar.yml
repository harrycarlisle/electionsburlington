name: Burlington local radar

on:
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_local_radar.py'
      - 'data/story-catalog.json'
      - 'data/editorial-policy.json'
      - '.github/workflows/local-radar.yml'

permissions:
  contents: write

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ranked local radar
        run: python scripts/build_local_radar.py
      - name: Commit radar state
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-radar"
          --message "Update Burlington local radar"
          data/local-radar.json data/radar-seen.json
