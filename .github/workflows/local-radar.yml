name: Burlington local radar

on:
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_local_radar.py'
      - 'data/story-catalog.json'
      - 'data/beat-watchlist.json'
      - 'data/editorial-policy.json'
      - '.github/workflows/local-radar.yml'

permissions:
  contents: read

concurrency:
  group: burlington-news-main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build ranked local radar
        run: python scripts/build_local_radar.py
      - name: Upload radar for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: burlington-local-radar-${{ github.run_id }}
          path: |
            data/local-radar.json
            data/radar-seen.json
          retention-days: 14
