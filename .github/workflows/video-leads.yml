name: Burlington video leads

on:
  schedule:
    # Idea discovery, not breaking news. GitHub cron can lag.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: burlington-news-video-leads
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover video leads
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PYTHONPATH: scripts
        run: python scripts/discover_video_leads.py --limit 20
      - name: Commit internal queue
        run: >-
          python scripts/safe_bot_commit.py
          --name "burlington-news-video-leads"
          --message "Update Burlington video leads"
          data/editorial/video-leads.json
