<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Burlington flood protection timeline since the 2014 storm</title>
<desc id="desc">Editorial timeline showing the August 2014 storm, more than 90 million dollars invested in stormwater infrastructure since 2015, Tuck Creek bridge upgrades and 7.9 million dollars in 2026 stormwater projects.</desc>
<rect width="1600" height="900" fill="#f5f7f4"/>
<text x="90" y="105" font-family="Georgia,serif" font-size="54" fill="#082b50">What changed after Burlington's 2014 flood?</text>
<text x="90" y="157" font-family="Arial,sans-serif" font-size="25" fill="#586b7a">More than $90 million has gone into stormwater infrastructure since 2015.</text>
<path d="M150 455H1450" stroke="#a8b8c4" stroke-width="8" stroke-linecap="round"/>
<g font-family="Arial,sans-serif">
  <circle cx="220" cy="455" r="24" fill="#2b7ab8"/>
  <text x="220" y="350" text-anchor="middle" font-size="26" font-weight="700" fill="#082b50">2014</text>
  <text x="220" y="390" text-anchor="middle" font-size="20" fill="#536777">190 mm of rain</text>
  <text x="220" y="500" text-anchor="middle" font-size="20" fill="#536777">3,000+ homes</text>
  <text x="220" y="530" text-anchor="middle" font-size="20" fill="#536777">reported flooding</text>

  <circle cx="520" cy="455" r="24" fill="#2b7ab8"/>
  <text x="520" y="350" text-anchor="middle" font-size="26" font-weight="700" fill="#082b50">2019</text>
  <text x="520" y="390" text-anchor="middle" font-size="20" fill="#536777">Regal Road</text>
  <text x="520" y="500" text-anchor="middle" font-size="20" fill="#536777">Tuck Creek bridge</text>
  <text x="520" y="530" text-anchor="middle" font-size="20" fill="#536777">upgrade completed</text>

  <circle cx="850" cy="455" r="24" fill="#2b7ab8"/>
  <text x="850" y="350" text-anchor="middle" font-size="26" font-weight="700" fill="#082b50">2025–26</text>
  <text x="850" y="390" text-anchor="middle" font-size="20" fill="#536777">New Street</text>
  <text x="850" y="500" text-anchor="middle" font-size="20" fill="#536777">Tuck Creek bridge</text>
  <text x="850" y="530" text-anchor="middle" font-size="20" fill="#536777">replacement phase</text>

  <circle cx="1160" cy="455" r="24" fill="#2b7ab8"/>
  <text x="1160" y="350" text-anchor="middle" font-size="26" font-weight="700" fill="#082b50">2026</text>
  <text x="1160" y="390" text-anchor="middle" font-size="20" fill="#536777">$7.9M</text>
  <text x="1160" y="500" text-anchor="middle" font-size="20" fill="#536777">stormwater projects</text>
  <text x="1160" y="530" text-anchor="middle" font-size="20" fill="#536777">city-wide</text>

  <circle cx="1390" cy="455" r="24" fill="#2b7ab8"/>
  <text x="1390" y="350" text-anchor="middle" font-size="26" font-weight="700" fill="#082b50">2027–28</text>
  <text x="1390" y="390" text-anchor="middle" font-size="20" fill="#536777">Spruce Avenue</text>
  <text x="1390" y="500" text-anchor="middle" font-size="20" fill="#536777">Tuck Creek bridge</text>
  <text x="1390" y="530" text-anchor="middle" font-size="20" fill="#536777">upgrade scheduled</text>
</g>
<rect x="90" y="650" width="1420" height="120" rx="16" fill="#e6eef4"/>
<text x="125" y="696" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#082b50">Still unresolved</text>
<text x="125" y="737" font-family="Arial,sans-serif" font-size="21" fill="#536777">Lower Rambo Creek's flood-mitigation environmental assessment is paused while external agencies review creek flows and spills.</text>
<text x="90" y="845" font-family="Arial,sans-serif" font-size="18" fill="#667784">Editorial timeline: Burlington News. Sources: City of Burlington flood-protection pages and Tuck Creek Flood Study.</text>
</svg>