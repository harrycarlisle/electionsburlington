    <path d="M1312 750h108M1312 793h108" stroke="#6e6a61" stroke-width="8"/>
  </g>

  <g transform="translate(1200 102)">
    <rect width="322" height="152" rx="10" fill="#f4d58d" stroke="#173a42" stroke-width="8"/>
    <text x="30" y="58" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#173a42">BURLINGTON</text>
    <text x="30" y="112" font-family="Georgia, serif" font-size="55" font-weight="700" fill="#a43f2f">1971</text>
