  <text x="1198" y="326" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#173a42">Before the</text>
  <text x="1198" y="386" font-family="Georgia, serif" font-size="54" font-weight="700" fill="#173a42">blue box</text>
  <path d="M1201 420h254" stroke="#a43f2f" stroke-width="12"/>
  <text x="1200" y="473" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173a42">1,000 homes</text>
  <text x="1200" y="513" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173a42">4 sorted streams</text>
  <text x="1200" y="553" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#173a42">No purpose-built bins</text>
</svg>
