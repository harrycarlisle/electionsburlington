<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Burlington's 1971 recycling experiment</title>
  <desc id="desc">An editorial reconstruction of a 1970s kitchen counter with a glass jar, metal can, newspapers and paper sorting bags, with Burlington homes and a collection truck beyond the window.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2dfbc"/><stop offset="1" stop-color="#d9b77c"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a8d4d5"/><stop offset="1" stop-color="#e7e5c7"/></linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#254f59"/><stop offset="1" stop-color="#12333c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#061820" flood-opacity=".28"/></filter>
    <pattern id="grain" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1" fill="#fff" opacity=".11"/><circle cx="22" cy="17" r="1" fill="#102e34" opacity=".09"/><circle cx="12" cy="27" r=".8" fill="#fff" opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <rect width="1600" height="1000" fill="url(#grain)"/>

  <rect x="112" y="92" width="1040" height="560" rx="8" fill="#f8f0d9" stroke="#173a42" stroke-width="24"/>
  <rect x="139" y="119" width="986" height="506" fill="url(#sky)"/>
  <path d="M139 475 C300 420 430 458 560 410 C705 358 805 415 940 365 C1015 338 1076 345 1125 360 L1125 625 L139 625Z" fill="#799273"/>
  <path d="M139 530 C330 500 490 535 650 492 C820 445 958 475 1125 432 L1125 625 L139 625Z" fill="#466c61"/>
  <g fill="#e9d7ad" stroke="#294c51" stroke-width="8">
    <path d="M196 504v-96l92-62 94 62v96z"/><path d="M432 492v-110l108-70 108 70v110z"/><path d="M716 467v-92l91-58 92 58v92z"/>
  </g>
  <g fill="#af5c3e"><path d="M183 411l105-77 107 77z"/><path d="M417 385l123-87 125 87z"/><path d="M703 378l104-74 108 74z"/></g>
  <path d="M908 526h142l55 36v45H916z" fill="#e9c75f" stroke="#173a42" stroke-width="8"/>
  <rect x="935" y="542" width="72" height="37" rx="3" fill="#f6edcf"/>
  <text x="971" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#173a42">TOWN</text>
  <circle cx="948" cy="612" r="22" fill="#173a42"/><circle cx="1065" cy="612" r="22" fill="#173a42"/>
  <path d="M632 119v506M139 292h986" stroke="#173a42" stroke-width="18"/>

  <rect y="646" width="1600" height="354" fill="url(#counter)"/>
  <path d="M0 671h1600" stroke="#f4d58d" stroke-width="14" opacity=".8"/>

  <g>
    <path d="M93 705h286l-32 237H124z" fill="#d6a65e" stroke="#142f37" stroke-width="8"/>
    <path d="M105 718l50-66h166l49 66" fill="none" stroke="#142f37" stroke-width="10"/>
    <text x="236" y="816" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#173a42">PAPER</text>
