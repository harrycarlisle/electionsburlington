    <path d="M718 718l47-66h156l46 66" fill="none" stroke="#142f37" stroke-width="10"/>
    <text x="841" y="816" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#173a42">METAL</text>
