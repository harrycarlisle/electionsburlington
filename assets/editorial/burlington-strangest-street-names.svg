<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Burlington street-name illustration</title>
<desc id="desc">Editorial illustration of four Burlington street signs: Powder Magazine Road, Locust Street, Putter Place and Tweedsmuir Court.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce9f2"/><stop offset="1" stop-color="#f7f3e9"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#59626a"/><stop offset="1" stop-color="#373f46"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0d243d" flood-opacity=".18"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<rect y="610" width="1600" height="290" fill="#a7b889"/>
<path d="M-90 900 C280 650 620 585 1710 520 L1710 900Z" fill="url(#road)"/>
<path d="M90 900 C410 702 805 630 1630 588" fill="none" stroke="#f2d45c" stroke-width="9" stroke-dasharray="38 32" opacity=".82"/>
<g opacity=".42" fill="#6d8157"><circle cx="160" cy="555" r="86"/><circle cx="275" cy="530" r="108"/><circle cx="1375" cy="525" r="105"/><circle cx="1490" cy="558" r="82"/></g>
<g stroke="#5b6b78" stroke-width="18" stroke-linecap="round"><path d="M520 710V220"/><path d="M1050 705V190"/></g>
<g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#fff">
  <g transform="translate(210 245) rotate(-2 0 0)"><rect width="610" height="120" rx="18" fill="#1b4f79" stroke="#fff" stroke-width="8"/><text x="305" y="76" text-anchor="middle" font-size="49" letter-spacing="1">POWDER MAGAZINE RD</text></g>
  <g transform="translate(810 195) rotate(2 0 0)"><rect width="490" height="108" rx="18" fill="#1b4f79" stroke="#fff" stroke-width="8"/><text x="245" y="69" text-anchor="middle" font-size="47">LOCUST ST</text></g>
  <g transform="translate(395 390) rotate(1 0 0)"><rect width="360" height="102" rx="17" fill="#1b4f79" stroke="#fff" stroke-width="8"/><text x="180" y="66" text-anchor="middle" font-size="45">PUTTER PL</text></g>
  <g transform="translate(915 350) rotate(-1 0 0)"><rect width="505" height="106" rx="17" fill="#1b4f79" stroke="#fff" stroke-width="8"/><text x="252" y="68" text-anchor="middle" font-size="44">TWEEDSMUIR CT</text></g>
</g>
<g opacity=".12" fill="#fff"><ellipse cx="770" cy="776" rx="530" ry="42"/></g>
</svg>