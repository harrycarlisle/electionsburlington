  <path d="M0 430 C160 398 286 470 437 438 C617 400 753 452 960 405 V560 H0Z" fill="#a9d9ec"/>
  <path d="M0 447 C164 415 287 485 442 454 C626 417 766 467 960 421" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="5"/>

  <g stroke="#ffffff" stroke-width="7" stroke-linejoin="round">
    <path d="M56 194 L69 86 L293 52 L365 170 L299 269 L151 258 Z" fill="#5a9ec5"/>
    <path d="M293 52 L553 72 L612 191 L518 272 L365 170 Z" fill="#64b8a5"/>
    <path d="M553 72 L850 115 L908 242 L707 287 L612 191 Z" fill="#dcbf58"/>
    <path d="M56 194 L151 258 L299 269 L362 357 L248 415 L78 372 Z" fill="#7e77b8"/>
    <path d="M299 269 L518 272 L612 351 L521 421 L362 357 Z" fill="#e58c68"/>
    <path d="M518 272 L707 287 L908 242 L908 390 L721 440 L612 351 Z" fill="#cd6f86"/>
  </g>

