<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Simplified diagram of Burlington's six 2026 voting wards</title>
  <desc id="desc">Ward 1 is in the west, Ward 2 is near the western waterfront, Ward 3 is north central, Ward 4 is south central, Ward 5 is in the southeast and Ward 6 is in the northeast. This is an orientation diagram, not an address-level boundary map.</desc>
