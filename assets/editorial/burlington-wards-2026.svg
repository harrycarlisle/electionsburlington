  <path d="M38 281 C187 253 334 292 474 264 C635 232 745 262 925 222" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="9 11" stroke-linecap="round"/>
  <text x="782" y="205" fill="#173a51" font-family="Arial, sans-serif" font-size="17" font-weight="700" transform="rotate(-10 782 205)">QEW</text>

  <g fill="#ffffff" font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(205 156)"><circle r="31" fill="#123e5a" fill-opacity=".88"/><text y="10" font-size="29" font-weight="800">1</text><text y="58" font-size="15" font-weight="700">Aldershot</text></g>
    <g transform="translate(454 148)"><circle r="31" fill="#123e5a" fill-opacity=".88"/><text y="10" font-size="29" font-weight="800">3</text><text y="58" font-size="15" font-weight="700">North central</text></g>
    <g transform="translate(738 170)"><circle r="31" fill="#123e5a" fill-opacity=".88"/><text y="10" font-size="29" font-weight="800">6</text><text y="58" font-size="15" font-weight="700">Northeast</text></g>
    <g transform="translate(201 334)"><circle r="31" fill="#123e5a" fill-opacity=".88"/><text y="10" font-size="29" font-weight="800">2</text><text y="58" font-size="15" font-weight="700">Downtown</text></g>
    <g transform="translate(456 343)"><circle r="31" fill="#123e5a" fill-opacity=".88"/><text y="10" font-size="29" font-weight="800">4</text><text y="58" font-size="15" font-weight="700">South central</text></g>
    <g transform="translate(745 346)"><circle r="31" fill="#123e5a" fill-opacity=".88"/><text y="10" font-size="29" font-weight="800">5</text><text y="58" font-size="15" font-weight="700">Southeast</text></g>
