lass="dash"/><path d="M505 0 C470 135 478 255 530 385 C575 498 590 565 595 650" class="roadEdge"/><path d="M505 0 C470 135 478 255 530 385 C575 498 590 565 595 650" class="road"/><circle cx="330" cy="310" r="145" class="ring"/><circle cx="330" cy="310" r="290" class="ring" opacity=".7"/><path d="M295 278 l95 -18 25 66 -100 24 z" class="site"/><circle cx="345" cy="303" r="14" fill="#fff" stroke="#e34c3c" stroke-width="6"/><rect x="384" y="245" width="235" height="72" rx="10" fill="#fff" opacity=".96"/><text x="403" y="274" class="label med">Proposed site</text><text x="403" y="301" class="label small">3110 S Service Rd</text><rect x="178" y="177" width="92" height="34" rx="8" fill="#0c3553"/><text x="224" y="201" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">500 m</text><rect x="84" y="66" width="80" height="34" rx="8" fill="#0c3553"/><text x="124" y="90" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">1 km</text><text x="135" y="392" class="label med" transform="rotate(-8 135 392)">QEW</text><text x="538" y="52" class="label small" transform="rotate(76 538 52)">Guelph Line</text><text x="78" y="245" class="label small">Burlington Centre</text><text x="510" y="505" class="label small">Home Depot area</text></g><text x="852" y="814" class="label small muted">Wider context: distance rings are for orientation only, not predicted noise, ecology or health boundaries.</text><rect x="50" y="842" width="1500" height="42" rx="10" fill="#f5f8fa"/><text x="70" y="868" class="label small muted">Burlington News diagram · Site location based on City of Burlington planning records. 500 m / 1 km are reference distances used here only to understand nearby receptors and context.</text></svg>