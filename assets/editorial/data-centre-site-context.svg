<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Proposed data centre site at 3110 South Service Road</title><desc id="desc">Two-panel Burlington News diagram. Left: close location context for the proposed data centre on South Service Road west of Guelph Line and south of the QEW. Right: wider context with 500 metre and 1 kilometre distance rings. Rings are distance references only, not predicted impact zones.</desc><defs><style>.bg{fill:#edf3f5}.land{fill:#dfe8e3}.road{fill:none;stroke:#fff;stroke-width:20;stroke-linecap:round}.roadEdge{fill:none;stroke:#c5d1d7;stroke-width:34;stroke-linecap:round}.qew{fill:none;stroke:#f2d467;stroke-width:64;stroke-linecap:round}.qewEdge{fill:none;stroke:#80939d;stroke-width:88;stroke-linecap:round}.dash{fill:none;stroke:#fff;stroke-width:4;stroke-dasharray:24 18}.label{font-family:Arial,Helvetica,sans-serif;fill:#102b3f}.small{font-size:18px}.med{font-size:22px;font-weight:700}.big{font-size:31px;font-weight:700}.site{fill:#e34c3c;stroke:#fff;stroke-width:5}.panel{fill:#fff;stroke:#cbd8df;stroke-width:2}.ring{fill:none;stroke:#0b5cab;stroke-width:4}.muted{fill:#587080}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="50" y="60" class="label big">Proposed data centre site</text><text x="50" y="92" class="label small muted">3110 South Service Rd · Burlington, Ontario</text><!-- left panel --><rect x="50" y="125" width="720" height="650" rx="22" class="bg"/><g transform="translate(50 125)"><rect width="720" height="650" rx="22" class="bg"/><rect x="35" y="50" width="210" height="145" rx="14" class="land"/><rect x="265" y="42" width="180" height="120" rx="14" class="land"/><rect x="500" y="58" width="170" height="150" rx="14" class="land"/><rect x="80" y="320" width="210" height="120" rx="14" fill="#ccd8dd"/><rect x="430" y="340" width="205" height="135" rx="14" fill="#ccd8dd"/><path d="M20 500 C170 440 340 420 700 400