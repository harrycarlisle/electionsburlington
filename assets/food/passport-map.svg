<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="mt md">
  <title id="mt">Where the five Food Passport spots sit in Burlington</title>
  <desc id="md">Orientation map. Downtown is left, Fairview is right, Lake Ontario is the blue band at the bottom.</desc>
  <rect width="720" height="280" fill="#edf3ed"/>
  <rect x="0" y="214" width="720" height="66" fill="#b6dced"/>
  <text x="20" y="28" fill="#37657e" font-family="Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="1.4">BURLINGTON</text>
  <text x="620" y="256" fill="#37657e" font-family="Arial,sans-serif" font-size="11" font-weight="800">LAKE ONTARIO</text>
  <g font-family="Arial,sans-serif" font-size="13" font-weight="800" fill="#fff">
    <circle cx="150" cy="168" r="14" fill="#0864c7"/><text x="146" y="173">1</text>
    <circle cx="196" cy="148" r="14" fill="#0864c7"/><text x="192" y="153">2</text>
    <circle cx="430" cy="98" r="14" fill="#0864c7"/><text x="426" y="103">3</text>
    <circle cx="286" cy="138" r="14" fill="#0864c7"/><text x="282" y="143">4</text>
    <circle cx="548" cy="92" r="14" fill="#0864c7"/><text x="544" y="97">5</text>
  </g>
</svg>
