<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Give feedback | Burlington News</title>
  <meta name="description" content="Tell Burlington News what could be clearer, more useful or more accurate.">
  <link rel="canonical" href="https://burlingtonnews.ca/feedback/">
  <link rel="stylesheet" href="/site-extra.css?v=20260824z4">
  <link rel="stylesheet" href="/feedback.css?v=20260826e">
  <link rel="stylesheet" href="/site-bundle.css?v=20260824z4" data-style="site-bundle">
  <link rel="stylesheet" href="/site-shell.css?v=20260824z4" data-style="site-shell">
  <link rel="stylesheet" href="/site-header.css?v=20260826f">
  <link rel="stylesheet" href="/type-system.css?v=20260826a">
  <script src="/site-search.js?v=20260826e" defer></script>
  <script src="/site-extra.js?v=20260826t" defer></script>
  <script src="/feedback.js?v=20260826e" defer></script>
</head>
<body class="simple-page feedback-page">
  <a class="skip" href="#main">Skip to content</a>
  <header class="header"><div class="wrap header-inner"><a class="brand" href="/">Burlington News</a><button class="menu" id="menuBtn" type="button" aria-expanded="false" aria-controls="mainNav">Menu</button><nav class="nav" id="mainNav" aria-label="Primary"></nav></div></header>
  <main id="main" class="feedback-main">
    <div class="feedback-shell">
      <a class="feedback-back" href="/">← Back</a>
      <div class="feedback-kicker">Give feedback</div>
      <h1>Help us improve Burlington News.</h1>
      <p class="feedback-lead">Tell us what could be clearer, more useful or more accurate.</p>
      <form id="feedbackForm" class="feedback-form">
        <div class="field-group">
          <label for="feedbackType">What is this about?</label>
          <select id="feedbackType" name="type">
            <option value="Something is inaccurate">Something is inaccurate</option>
            <option value="Something is confusing">Something is confusing</option>
            <option value="Something is missing">Something is missing</option>
            <option value="Accessibility issue">Accessibility issue</option>
            <option value="Site problem">Site problem</option>
            <option value="General feedback">General feedback</option>
          </select>
        </div>
        <div class="field-group">
          <label for="feedbackMessage">Feedback</label>
          <textarea id="feedbackMessage" name="message" rows="6" required placeholder="What would you change?"></textarea>
        </div>
        <div class="field-group">
          <label for="feedbackEmail">Email address <span>optional</span></label>
          <input id="feedbackEmail" name="email" type="email" autocomplete="email" inputmode="email">
        </div>
        <button class="feedback-submit" type="submit">Send feedback</button>
        <div class="feedback-status" id="feedbackStatus" role="status" aria-live="polite"></div>
      </form>
    </div>
  </main>
</body>
</html>
