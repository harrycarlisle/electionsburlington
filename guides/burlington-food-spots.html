<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Burlington food spots worth trying | Burlington News</title>
  <meta name="description" content="A small Burlington food passport. Mark where you have eaten without creating an account.">
  <link rel="canonical" href="https://burlingtonnews.ca/guides/burlington-food-spots.html">
  <link rel="stylesheet" href="/site-extra.css?v=20260825i">
  <link rel="stylesheet" href="/site-bundle.css?v=20260824z4">
  <link rel="stylesheet" href="/site-shell.css?v=20260824z5">
  <link rel="stylesheet" href="/product-pass.css?v=20260825i">
  <script src="/site-extra.js?v=20260825i" defer></script>
  <script src="/food-passport.js?v=20260825i" defer></script>
  <style>
    .food-shell{width:min(calc(100% - 40px),980px);margin:38px auto 70px}
    .food-shell h1{max-width:16ch;margin:0;color:var(--navy);font:700 clamp(40px,6vw,64px)/.96 var(--font-display);letter-spacing:-.04em}
    .food-progress{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:28px 0 16px;position:relative}
    .food-progress h2{margin:0;font:700 28px/1 var(--font-display)}
    .food-progress strong{font:750 14px/1 var(--font-ui)}
    .info-button{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:transparent;cursor:pointer}
    .food-why{position:absolute;right:0;top:44px;z-index:5;width:min(320px,calc(100vw - 32px));padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper,#fff);box-shadow:0 12px 30px rgba(0,0,0,.12);font:14px/1.45 var(--font-body)}
    .food-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .food-card{display:flex;min-height:210px;flex-direction:column;padding:18px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--card,#fff)}
    .food-card small{color:var(--blue);font:750 11px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase}
    .food-card h3{margin:10px 0 6px;font:750 22px/1.15 var(--font-ui)}
    .food-card p{margin:0;color:var(--muted);font:15px/1.45 var(--font-body)}
    .food-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:18px}
    .food-card a,.food-card button{display:inline-flex;align-items:center;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-control);background:#fff;color:var(--navy);font:750 13px/1 var(--font-ui);text-decoration:none;cursor:pointer}
    .star-rating{display:flex;gap:4px;margin-top:10px}
    .star-rating button{border:0;background:transparent;color:#c5ccd1;font-size:22px}
    .star-rating button.is-on{color:#d4a017}
    .food-note{margin-top:10px;font-size:13px}
    @media(max-width:720px){.food-shell{width:calc(100% - 32px)}.food-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="header"><div class="wrap header-inner"><a class="brand" href="/">Burlington News</a><button class="menu" id="menuBtn" aria-expanded="false" aria-controls="mainNav">Menu</button><nav class="nav" id="mainNav" aria-label="Primary"></nav></div></header>
  <main id="main" class="food-shell">
    <h1>Five local meals to start with.</h1>
    <div class="food-progress">
      <h2>Your food passport</h2>
      <span><strong id="foodCount">0 of 5 tried</strong> <button class="info-button" id="foodWhy" type="button" aria-label="Why five?">ⓘ</button></span>
      <p class="food-why" id="foodWhyPop" hidden><strong>Why five?</strong> We start with a small set of well-supported local picks so the passport stays achievable. More can rotate in over time.</p>
    </div>
    <section class="food-grid" id="foodGrid" aria-label="Burlington food passport"></section>
  </main>
</body>
</html>
