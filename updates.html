<h1>Burlington in 30 seconds</h1>
<p class="content-lead">The biggest changes in Burlington politics.</p>
<div class="update-list" id="updatesList" aria-live="polite"></div>
</main>
<script>
(async()=>{
  const data=await fetch('data/daily-brief.json',{cache:'no-store'}).then(r=>r.json());
  const out=document.getElementById('updatesList');
  const action=i=>i.mediaType==='video'?`Watch${i.source?` on ${i.source}`:''} ↗`:i.sourceType==='official'?'Official source ↗':`Read${i.source?` on ${i.source}`:''} ↗`;
  const why=i=>Number(i.importance||0)>=3&&i.why?`<p class="why"><strong>Why it matters:</strong> ${i.why}</p>`:'';
  out.innerHTML=(data.items||[]).map(i=>`<article class="update-item">${i.image?`<img class="update-image" src="${i.image}" alt="" loading="lazy">`:''}<div class="update-item-top"><span class="brief-tag">${i.tag||'Burlington'}</span><time datetime="${i.date}">${new Date(i.date+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'})}</time></div><h2>${i.headline}</h2><p>${i.summary}</p>${why(i)}<a href="${i.url}" target="_blank" rel="noopener">${action(i)}</a></article>`).join('');
  const itemList={"@context":"https://schema.org","@type":"ItemList","name":"Latest Burlington politics and City Hall updates","itemListElement":(data.items||[]).map((i,n)=>({"@type":"ListItem","position":n+1,"url":i.url,"name":i.headline}))};
  const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify(itemList);document.head.appendChild(ld);
})();
</script>
