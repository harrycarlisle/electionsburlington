name = "bn-contact"
main = "workers/contact.js"
compatibility_date = "2026-08-26"

[vars]
CONTACT_EMAIL_TO = "feedback@burlingtonnews.ca"

# Set secrets with:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put CONTACT_EMAIL_FROM
# CONTACT_EMAIL_FROM must be a verified Resend sender, for example:
#   Burlington News <noreply@burlingtonnews.ca>
#
# Optional route so GitHub Pages keeps the site and this worker only
# handles the form endpoint:
# [[routes]]
# pattern = "burlingtonnews.ca/api/contact"
# zone_name = "burlingtonnews.ca"
